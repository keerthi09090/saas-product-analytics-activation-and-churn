name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff==0.15.6

      - name: Lint source and tests
        run: ruff check .

      - name: Generate deterministic SaaS data
        run: python -m simulator.generate

      - name: Initialize empty streaming Parquet schema
        run: python -c "from streaming.consumer import ensure_streaming_storage; ensure_streaming_storage()"

      - name: Build dbt models required by Python tests
        working-directory: analytics_dbt
        run: dbt run --profiles-dir .

      - name: Build deterministic ML test artifacts
        run: |
          python ml/build_dataset.py
          python ml/train.py
          python ml/score_accounts.py

      - name: Run all Python tests
        run: python -m pytest
