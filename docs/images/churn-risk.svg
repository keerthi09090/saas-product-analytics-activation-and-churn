    <g transform="translate(335 125)"><rect width="250" height="105" rx="12" fill="#fff" stroke="#e2e8f0"/><text x="22" y="34" font-size="15" fill="#64748b">High Risk</text><text x="22" y="78" font-size="36" font-weight="700" fill="#b91c1c">0</text></g>
