    <rect x="55" y="265" width="1090" height="335" rx="14" fill="#fff" stroke="#e2e8f0"/>
    <text x="82" y="308" font-size="21" font-weight="700" fill="#0f172a">Highest-Ranked Accounts</text>
    <g font-size="14" fill="#64748b"><text x="82" y="350">ACCOUNT</text><text x="220" y="350">SCORE</text><text x="350" y="350">RISK</text><text x="465" y="350">MRR</text><text x="570" y="350">MAIN DESCRIPTIVE REASON</text></g>
    <line x1="82" y1="365" x2="1115" y2="365" stroke="#e2e8f0"/>
    <g font-size="16" fill="#0f172a">
      <text x="82" y="411" font-weight="700">A082</text><text x="220" y="411">0.584</text><text x="350" y="411" fill="#b45309" font-weight="700">Medium</text><text x="465" y="411">$49</text><text x="570" y="411">No recent reports; last report was 281 days ago</text>
